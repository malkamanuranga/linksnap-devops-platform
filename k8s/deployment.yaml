apiVersion: apps/v1
kind: Deployment
metadata: { name: linksnap, namespace: linksnap }
spec:
  replicas: 1
  selector: { matchLabels: { app: linksnap } }
  template:
    metadata: { labels: { app: linksnap } }
    spec:
      containers:
        - name: linksnap
          image: linksnap:local
          imagePullPolicy: Never
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5